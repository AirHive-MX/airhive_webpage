    <!--
      Estos dos no se pedían hasta que React montaba. Adelantándolos aquí bajan

    <!--
      La pantalla de carga vive aquí y no en React a propósito: como componente
      solo aparecería DESPUÉS de descargar y montar el bundle, que es justo el
      tramo en que la página está en blanco. Escrita en el HTML, pinta en el
      primer fotograma del navegador.

      El logo va incrustado en base64 por lo mismo: una petición aparte llegaría
      después del fondo y se vería aparecer en dos tiempos.
    -->
    <style>
      #ah-carga {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        /*
         * No es el azul de marca a tope, y es a propósito. Medido: a #060D96
         * la pantalla salía al 96% de saturación, más del doble que el primer
         * fotograma al que entrega (46%), y era la superficie más saturada de
         * toda la página. Desde que espera al 100% real dura entre uno y cinco
         * segundos, y tanta saturación tanto rato deja la foto lavada al
         * levantarse. Este baja a 76% y sube la luminancia a 11.7%, que la
         * escalona entre los globos (7.1%) y el primer fotograma (17.1%).
         */
        background: #121d4a;
        transition: opacity 500ms ease;
      }
      #ah-carga.se-va {
        opacity: 0;
        pointer-events: none;
      }
      #ah-carga img {
        width: 132px;
        height: auto;
        /* El monograma es azul de marca; aquí se necesita blanco. */
        filter: brightness(0) invert(1);
        animation: ah-latido 1.6s ease-in-out infinite;
      }
      #ah-carga p {
        margin: 0;
        font:
          500 0.7rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.18em;
        color: rgb(255 255 255 / 55%);
        font-variant-numeric: tabular-nums;
      }
      @keyframes ah-latido {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.62;
          transform: scale(0.965);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #ah-carga img {
          animation: none;
        }
      }
    </style>
  </head>

    <script>
      /*
       * Puente mínimo para que la app avise. Dos guardas:
       * - un mínimo, para que con caché caliente no dé un parpadeo;
       * - un máximo, para que una conexión mala o un fallo de JS no deje a
       *   nadie atrapado mirando el logo.
       */
      (function () {
        var capa = document.getElementById("ah-carga");
        var texto = document.getElementById("ah-carga-pct");
        var nacio = Date.now();
        var MINIMO = 500;
        /*
         * El tope ya no es "lo que tarde en estar usable" sino una red de
         * seguridad de verdad: la pantalla se queda hasta que esté cargado el
         * recorrido entero, que son 13 MB y en una conexión normal van entre 1
         * y 4 segundos. Con 5 s se cerraba a media descarga y el 100% era
         * mentira; a 30 solo salta si algo se ha roto, y mientras tanto el
         * porcentaje va contando, que es lo que dice que sigue vivo.
         */
        var MAXIMO = 30000;
        var cerrada = false;

        function cerrar() {
          if (cerrada) return;
          cerrada = true;
          var espera = Math.max(0, MINIMO - (Date.now() - nacio));
          setTimeout(function () {
            texto.textContent = "100%";
            capa.classList.add("se-va");
            setTimeout(function () {
              capa.remove();
            }, 520);
          }, espera);
        }

        window.__ahCarga = {
          progreso: function (f) {
            if (cerrada) return;
            texto.textContent = Math.round(Math.min(Math.max(f, 0), 1) * 100) + "%";
          },
          cerrar: cerrar,
        };

        setTimeout(cerrar, MAXIMO);
      })();
    </script>
